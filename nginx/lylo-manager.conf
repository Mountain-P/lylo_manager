# Lylo Manager - 庫存管理系統 Nginx 配置
# 適用於生產環境部署

# Upstream 後端服務配置
upstream backend_api {
    server 127.0.0.1:3000;
    keepalive 32;
}

# 主要服務器配置
server {
    listen 80;
    server_name localhost;  # 請修改為您的域名
    
    # 基本安全設定
    server_tokens off;
    client_max_body_size 50M;
    
    # 訪問和錯誤日誌
    access_log /var/log/nginx/lylo-manager-access.log;
    error_log /var/log/nginx/lylo-manager-error.log;
    
    # 前端靜態文件根目錄
    root /root/lylo_manager/frontend_v4/dist;
    index index.html;
    
    # Gzip 壓縮設定
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        application/javascript
        application/json
        application/xml
        text/css
        text/javascript
        text/plain
        text/xml;
    
    # 靜態資源緩存設定
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }
    
    # API 代理配置
    location /api/ {
        proxy_pass http://backend_api;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        
        # 超時設定
        proxy_connect_timeout 30s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
        
        # 緩衝設定
        proxy_buffering on;
        proxy_buffer_size 4k;
        proxy_buffers 8 4k;
        proxy_busy_buffers_size 8k;
    }
    
    # 健康檢查端點
    location /health {
        proxy_pass http://backend_api/health;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        access_log off;
    }
    
    # Vue Router History Mode 支援
    # 所有非API、非靜態資源的請求都返回 index.html
    location / {
        try_files $uri $uri/ @fallback;
    }
    
    location @fallback {
        rewrite ^.*$ /index.html last;
    }
    
    # 禁止訪問隱藏文件
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
    
    # 禁止訪問備份文件
    location ~ ~$ {
        deny all;
        access_log off;
        log_not_found off;
    }
}

